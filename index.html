<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0907" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LX Barbershop" />
<title>LX Barbershop</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <button id="install-btn" hidden>📲 Install app</button>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
          onerror="var s=document.createElement('script');s.src='https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js';document.head.appendChild(s);"></script>
  <script src="app.js"></script>
  <script>
    // Register the service worker so the app is installable and works offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // An installed app resumed from the background never navigates, so
          // the browser wouldn't look for a new version: check on every return.
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") reg.update().catch(() => {});
          });
        }).catch((err) => {
          console.warn("SW register failed", err);
        });
      });

      // When a new version takes over, reload once so the new look shows
      // right away, but never in the middle of typing an amount.
      // Queued entries are kept in localStorage, so nothing is lost.
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      const reloadWhenIdle = () => {
        if (reloading) return;
        if (typeof isMidEntry === "function" && isMidEntry()) {
          setTimeout(reloadWhenIdle, 3000);
          return;
        }
        reloading = true;
        location.reload();
      };
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController) reloadWhenIdle();
      });
    }

    // Show a custom Install button when the browser allows it (Android/desktop Chrome).
    let deferredPrompt;
    const installBtn = document.getElementById("install-btn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      installBtn.hidden = true;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    });
    window.addEventListener("appinstalled", () => {
      installBtn.hidden = true;
    });
  </script>
</body>
</html>
